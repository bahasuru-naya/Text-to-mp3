<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to MP3 Converter</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236c63ff'/%3E%3Cpath fill='white' d='M18.39 14.56C16.71 13.7 14.53 13 12 13s-4.71.7-6.39 1.56A2.97 2.97 0 0 0 4 17.22V20h16v-2.78c0-1.12-.61-2.1-1.61-2.66zM9.78 12h4.44c1.21-.92 2-2.33 2-3.78C16.22 5.89 14.33 4 12 4S7.78 5.89 7.78 8.22c0 1.45.79 2.86 2 3.78zM20.47 5.08 19 6.55c.92 1.03 1.5 2.38 1.5 3.88s-.58 2.85-1.5 3.88l1.47 1.47C21.78 14.28 22.5 12.23 22.5 10s-.72-4.28-2.03-4.92z'/%3E%3C/svg%3E">
    <meta name="description"
        content="Convert any text into a downloadable MP3 audio file instantly using this free Text-to-Speech web app.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f1117;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #6c63ff;
            --accent-light: #a89dff;
            --accent-glow: rgba(108, 99, 255, 0.35);
            --text: #e8e6f0;
            --text-muted: #8a87a0;
            --success: #22d3a5;
            --error: #f87171;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(108, 99, 255, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(34, 211, 165, 0.08) 0%, transparent 60%);
        }

        header {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .logo svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 560px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        textarea,
        input[type="text"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            padding: 14px 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            resize: vertical;
        }

        textarea {
            min-height: 130px;
        }

        textarea:focus,
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .char-count {
            text-align: right;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .char-count.warn {
            color: var(--error);
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .row .field {
            flex: 1;
            margin-bottom: 0;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, var(--accent), #9b59ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 14px 24px;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button[type="submit"]:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 28px var(--accent-glow);
        }

        button[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Status */
        #status {
            margin-top: 24px;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
        }

        #status.loading {
            display: flex;
            background: rgba(108, 99, 255, 0.12);
            border: 1px solid rgba(108, 99, 255, 0.3);
            color: var(--accent-light);
        }

        #status.success {
            display: flex;
            background: rgba(34, 211, 165, 0.1);
            border: 1px solid rgba(34, 211, 165, 0.3);
            color: var(--success);
        }

        #status.error {
            display: flex;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--error);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(168, 157, 255, 0.3);
            border-top-color: var(--accent-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Audio player */
        #audioSection {
            margin-top: 24px;
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        #audioSection.visible {
            display: flex;
        }

        #audioPlayer {
            width: 100%;
            border-radius: 10px;
            outline: none;
            accent-color: var(--accent);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 10px 16px;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
            align-self: flex-start;
        }

        .download-btn:hover {
            background: rgba(108, 99, 255, 0.15);
            border-color: var(--accent);
            color: var(--accent-light);
        }

        footer {
            margin-top: 32px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M18.39 14.56C16.71 13.7 14.53 13 12 13s-4.71.7-6.39 1.56A2.97 2.97 0 0 0 4 17.22V20h16v-2.78c0-1.12-.61-2.1-1.61-2.66zM9.78 12h4.44c1.21-.92 2-2.33 2-3.78C16.22 5.89 14.33 4 12 4S7.78 5.89 7.78 8.22c0 1.45.79 2.86 2 3.78zM20.47 5.08 19 6.55c.92 1.03 1.5 2.38 1.5 3.88s-.58 2.85-1.5 3.88l1.47 1.47C21.78 14.28 22.5 12.23 22.5 10s-.72-4.28-2.03-4.92z" />
            </svg>
        </div>
        <h1>Text to MP3</h1>
        <p class="subtitle">Convert any text into a downloadable audio file</p>
    </header>

    <div class="card">
        <form id="audioForm">
            <div class="field">
                <label for="text">Enter Text</label>
                <textarea id="text" name="text" placeholder="Type or paste the text you want to convert to speech…"
                    maxlength="5000"></textarea>
                <div class="char-count"><span id="charCount">0</span> / 5000</div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="fileName">Output File Name</label>
                    <input type="text" id="fileName" name="fileName" placeholder="e.g. my_audio" maxlength="100">
                </div>
                <button type="submit" id="submitBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55A4 4 0 1 0 14 17V5h4V3h-6z" />
                    </svg>
                    Create MP3
                </button>
            </div>
        </form>

        <div id="status">
            <div class="spinner" id="spinner"></div>
            <span id="statusText"></span>
        </div>

        <div id="audioSection">
            <audio controls id="audioPlayer"></audio>
            <a id="downloadLink" class="download-btn" download>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M5 20h14v-2H5v2zm7-18v10.17l-3.59-3.58L7 10l5 5 5-5-1.41-1.41L13 12.17V2h-1z" />
                </svg>
                Download MP3
            </a>
        </div>
    </div>

    <footer>Powered by simple-tts-mp3 &amp; Express.js</footer>

    <script>
        const textarea = document.getElementById('text');
        const charCount = document.getElementById('charCount');
        const form = document.getElementById('audioForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const audioSection = document.getElementById('audioSection');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');

        // Live character counter
        textarea.addEventListener('input', () => {
            const len = textarea.value.length;
            charCount.textContent = len;
            charCount.parentElement.classList.toggle('warn', len > 4500);
        });

        function setStatus(type, message) {
            statusDiv.className = type;
            statusText.textContent = message;
            spinner.style.display = type === 'loading' ? 'block' : 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = textarea.value.trim();
            const fileName = document.getElementById('fileName').value.trim();

            if (!text) { setStatus('error', 'Please enter some text to convert.'); return; }
            if (!fileName) { setStatus('error', 'Please enter a file name.'); return; }

            submitBtn.disabled = true;
            audioSection.classList.remove('visible');
            setStatus('loading', 'Generating your MP3, please wait…');

            try {
                const response = await fetch('/create-audio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, fileName }),
                });

                const result = await response.json();

                if (response.ok) {
                    setStatus('success', result.message || 'MP3 created successfully!');
                    // Append timestamp to bust browser cache for same filename
                    audioPlayer.src = result.filePath + '?t=' + Date.now();
                    downloadLink.href = result.filePath;
                    downloadLink.download = fileName.replace(/[^a-zA-Z0-9_\-]/g, '_') + '.mp3';
                    audioSection.classList.add('visible');
                } else {
                    setStatus('error', result.error || 'Something went wrong.');
                }
            } catch (err) {
                setStatus('error', 'Network error — is the server running?');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
